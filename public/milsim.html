<style>
  :root {
    --bg: #e9e1cc; --panel: #f4eedd; --panel2: #efe7d3;
    --border: rgba(60,45,20,.16); --border2: rgba(60,45,20,.30);
    --rust: #b8441a; --muted: #6a5d45; --text: #3d3424; --ink: #1e1a12;
    --ams: #ff7b00; --msw: #3a8dde; --realsim: #f4f1ea;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans Condensed', sans-serif; }

  /* nav — same bar as the main page */
  nav { position: sticky; top: 0; z-index: 100; background: rgba(42,36,24,.96); backdrop-filter: blur(14px); }
  .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 48px; display: flex; }
  nav ul { display: flex; list-style: none; }
  nav a { display: flex; align-items: center; gap: 8px; padding: 14px 22px; font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: #b9aa88; text-decoration: none; border-bottom: 2px solid transparent; }
  nav a:hover, nav a.active { color: #f1c9a0; border-bottom-color: #f1c9a0; }
  a.nav-tool-link { margin-left: 12px; color: #f1c9a0; border: 1px solid rgba(241,201,160,.35); border-bottom: 2px solid #f1c9a0; padding: 10px 16px; background: rgba(241,201,160,.06); clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%); align-self: center; }
  a.nav-tool-link .nav-idx { opacity: 1; font-size: 11px; }
  .nav-idx { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; opacity: .45; }

  main { max-width: 1200px; margin: 0 auto; padding: 36px 48px 70px; }
  .eye { font: 500 10px 'IBM Plex Mono', monospace; letter-spacing: 3px; color: var(--rust); text-transform: uppercase; }
  h1 { font: 800 clamp(48px, 8vw, 72px)/1 'Big Shoulders Stencil Display', sans-serif; color: var(--ink); letter-spacing: 2px; margin: 6px 0 10px; }
  .sub { color: var(--muted); font-size: 15px; max-width: 640px; line-height: 1.5; }
  .sub a { color: var(--rust); }

  .mapbox { margin-top: 24px; background: var(--panel); border: 1px solid var(--border2); position: relative; }
  #us { overflow: hidden; }
  #us { width: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .st { fill: #d9cca8; cursor: pointer; transition: fill .2s; }
  .st:hover { fill: #cdbb8c; }
  .st.has { fill: #d3c196; }
  .st.on { fill: #e3b596; }
  .borders { fill: none; stroke: #6b5b3b; stroke-width: .8; stroke-dasharray: 5 2 1 2; vector-effect: non-scaling-stroke; pointer-events: none; }
  .nation { fill: none; stroke: #5d4e31; stroke-width: 1.3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .ctx { fill: #e4dcc6; stroke: #b8a982; stroke-width: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
  .river { fill: none; stroke: #86a5a6; stroke-width: 1.1; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
  .lake { fill: #a9c1bf; stroke: #6f8f8e; stroke-width: .7; vector-effect: non-scaling-stroke; pointer-events: none; }
  .lbl { font: 600 11px 'IBM Plex Mono', monospace; letter-spacing: 1px; fill: #6e5a36; opacity: .55; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .lbl.sm { display: none; }
  #us.zoomed .lbl.sm { display: inline; }
  .city { display: none; pointer-events: none; }
  #us.zoomed .city { display: inline; }
  .city rect { fill: #2a2418; }
  .city text { font: 500 10px 'IBM Plex Mono', monospace; fill: #2a2418; paint-order: stroke; stroke: #f4eedd; stroke-width: 3px; stroke-linejoin: round; }
  .dot { cursor: pointer; stroke: #2a2418; }
  .dot.hot { stroke: var(--rust); }
  .dot:focus { outline: none; }
  .dot:focus-visible { stroke: var(--rust); }
  .map-bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--border2); font: 10px 'IBM Plex Mono', monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; border: 1px solid #2a2418; vertical-align: -1px; }
  /* zoom ruler: drag the handle (or +/−) to change the map scale; the bar shows real miles */
  .zoomctl { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .zoomctl button { width: 26px; height: 26px; border: 1px solid var(--border2); background: var(--panel); color: var(--ink); font: 600 14px/1 'IBM Plex Mono', monospace; cursor: pointer; }
  .zoomctl button:hover { border-color: var(--rust); color: var(--rust); }
  #zoom { -webkit-appearance: none; appearance: none; width: 130px; height: 22px; background:
      repeating-linear-gradient(90deg, #6e5a36 0 1px, transparent 1px 13px) center / 100% 7px no-repeat,
      linear-gradient(#6e5a36, #6e5a36) center / 100% 1.5px no-repeat; cursor: pointer; }
  #zoom::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 20px; background: var(--rust); border: 1px solid #2a2418; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
  #zoom::-moz-range-thumb { width: 12px; height: 20px; background: var(--rust); border: 1px solid #2a2418; border-radius: 0; }
  #zoom:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .scalebar { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 70px; }
  .scalebar i { display: block; height: 5px; border: 1.5px solid #2a2418; border-top: 0; transition: width .1s; }
  #us.grab { cursor: grab; touch-action: none; } /* when zoomed, a finger drag pans the map instead of scrolling */
  #us.dragging, #us.dragging .st { cursor: grabbing; }
  .reset { margin-left: 4px; background: none; border: 1px solid var(--border2); padding: 5px 10px; font: inherit; letter-spacing: 1.5px; text-transform: uppercase; color: var(--rust); cursor: pointer; visibility: hidden; }
  .reset.show { visibility: visible; }
  .tip { position: absolute; z-index: 5; width: 250px; background: var(--panel); border: 1px solid #2a2418; box-shadow: 0 6px 20px rgba(42,36,24,.25); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
  .tip.show { opacity: 1; transform: none; }
  .tip.pinned { pointer-events: auto; }
  .tip .ti { height: 96px; background: #cbbf9f center/cover no-repeat; border-bottom: 1px solid var(--border2); }
  .tip .tb { padding: 9px 12px 10px; }
  .tip .nm { font-size: 16px; margin: 3px 0 2px; }
  .tip .dt { font-size: 10.5px; }
  .tip .go { display: inline-block; margin-top: 7px; font: 500 9.5px 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase; color: var(--rust); text-decoration: none; }
  .tip::after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: var(--panel); border: solid #2a2418; border-width: 0 1px 1px 0; transform: rotate(45deg); }
  .tip.below::after { bottom: auto; top: -7px; border-width: 1px 0 0 1px; }
  .hint { position: absolute; top: 10px; right: 12px; font: 10px 'IBM Plex Mono', monospace; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; pointer-events: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 22px 0 10px; }
  .chip { font: 500 9.5px 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase; padding: 6px 12px; background: transparent; border: 1px solid var(--border2); color: var(--muted); cursor: pointer; }
  .chip.active { background: var(--rust); border-color: var(--rust); color: #fbf6ea; }
  .chip span { opacity: .6; margin-left: 4px; }

  .list { display: flex; flex-direction: column; gap: 1px; background: var(--border2); border: 1px solid var(--border2); }
  .ev { display: grid; grid-template-columns: 76px 168px 1fr 120px; align-items: stretch; background: var(--panel); text-decoration: none; color: inherit; transition: background .15s; }
  .ev:hover, .ev.hot { background: var(--panel2); }
  .ev[hidden] { display: none; }
  .d { display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--border2); padding: 12px 0; }
  .d b { font: 500 10px 'IBM Plex Mono', monospace; letter-spacing: 2px; color: var(--rust); text-transform: uppercase; }
  .d i { font: 800 36px/1 'Big Shoulders Stencil Display', sans-serif; font-style: normal; color: var(--ink); }
  .d small { font: 9px 'IBM Plex Mono', monospace; color: var(--muted); }
  .im { background: #cbbf9f center/cover no-repeat; border-right: 1px solid var(--border2); min-height: 92px; }
  .tx { padding: 12px 18px; display: flex; flex-direction: column; justify-content: center; }
  .org { font: 500 9px 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .org span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; border: 1px solid #2a2418; }
  .nm { font-weight: 700; font-size: 20px; color: var(--ink); margin: 3px 0; line-height: 1.15; }
  .dt { font: 11px 'IBM Plex Mono', monospace; color: var(--muted); }
  .ar { display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; font: 500 10px 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase; color: var(--rust); }
  .empty { padding: 28px 18px; background: var(--panel); font: 11px 'IBM Plex Mono', monospace; color: var(--muted); }
  .foot { margin-top: 14px; font: 10px 'IBM Plex Mono', monospace; letter-spacing: 1px; color: var(--muted); }

  @media (max-width: 768px) {
    .nav-inner { padding: 0 8px; overflow-x: auto; }
    nav ul { flex: 1; justify-content: space-between; }
    nav .nav-idx, nav .nav-long { display: none; }
    nav a { padding: 15px 7px; font-size: 10.5px; letter-spacing: 1.2px; white-space: nowrap; }
    a.nav-tool-link { margin-left: 2px; padding: 8px 10px; font-size: 9.5px; letter-spacing: 1px; clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%); }
    main { padding: 24px 16px 50px; }
    .hint { display: none; }
    #us:not(.zoomed) .lbl { display: none; } /* too crowded on a phone until you zoom in */
    .ev { grid-template-columns: 60px 1fr; }
    .im, .ar { display: none; }
    .tx { padding: 11px 12px; }
    .nm { font-size: 16px; }
    .d i { font-size: 30px; }
    .chip { padding: 9px 12px; } /* 40px+ touch target */
  }
</style>

ht="3"/><text x="774.6" y="243.6">Pittsburgh</text></g><g class="city"><rect x="540.5" y="159.4" width="3" height="3"/><text x="546.0" y="162.1">Minneapolis</text></g><g class="city"><rect x="265.5" y="547.8" width="3" height="3"/><text x="271.0" y="550.5">Honolulu</text></g><g class="city"><rect x="96.3" y="45.0" width="3" height="3"/><text x="101.8" y="47.7">Seattle</text></g><g class="city"><rect x="195.9" y="398.3" width="3" height="3"/><text x="201.4" y="401.0">Phoenix</text></g><g class="city"><rect x="98.4" y="395.9" width="3" height="3"/><text x="103.9" y="398.6">San Diego</text></g><g class="city"><rect x="597.5" y="301.9" width="3" height="3"/><text x="603.0" y="304.6">St. Louis</text></g><g class="city"><rect x="612.5" y="499.4" width="3" height="3"/><text x="618.0" y="502.1">New Orleans</text></g><g class="city"><rect x="481.5" y="439.1" width="3" height="3"/><text x="487.0" y="441.8">Dallas</text></g><g class="city"><rect x="907.1" y="166.3" width="3" height="3"/><text x="912.6" y="169.0">Boston</text></g><g class="city"><rect x="768.0" y="529.4" width="3" height="3"/><text x="773.5" y="532.1">Tampa</text></g><g class="city"><rect x="852.5" y="235.8" width="3" height="3"/><text x="858.0" y="238.5">Philadelphia</text></g><g class="city"><rect x="711.6" y="205.7" width="3" height="3"/><text x="717.1" y="208.4">Detroit</text></g><g class="city"><rect x="33.7" y="259.8" width="3" height="3"/><text x="39.2" y="262.5">San Francisco</text></g><g class="city"><rect x="341.4" y="272.3" width="3" height="3"/><text x="346.9" y="275.0">Denver</text></g><g class="city"><rect x="509.4" y="508.2" width="3" height="3"/><text x="514.9" y="510.9">Houston</text></g><g class="city"><rect x="820.4" y="570.5" width="3" height="3"/><text x="825.9" y="573.2">Miami</text></g><g class="city"><rect x="713.9" y="403.8" width="3" height="3"/><text x="719.4" y="406.5">Atlanta</text></g><g class="city"><rect x="636.7" y="225.3" width="3" height="3"/><text x="642.2" y="228.0">Chicago</text></g><g class="city"><rect x="85.5" y="361.7" width="3" height="3"/><text x="91.0" y="364.4">Los Angeles</text></g><g class="city"><rect x="826.4" y="265.9" width="3" height="3"/><text x="831.9" y="268.6">Washington,  D.C.</text></g><g class="city"><rect x="868.3" y="214.0" width="3" height="3"/><text x="873.8" y="216.7">New York</text></g></g><g id="dots"></g></svg>

<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script>
(function () {
  const ORG = { ams: 'American Milsim', msw: 'MilSim West', realsim: 'RealSim' };
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const FULL = [0, 0, 975, 610];
  const svg = document.getElementById('us'), dotsG = document.getElementById('dots');
  const labelsG = document.getElementById('labels'), citiesG = document.getElementById('cities');
  citiesG.querySelectorAll('.city').forEach(c => { const r = c.querySelector('rect'); c.dataset.x = +r.getAttribute('x') + 1.5; c.dataset.y = +r.getAttribute('y') + 1.5; });
  const list = document.getElementById('list'), chips = document.getElementById('chips'), reset = document.getElementById('reset');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // same projection us-atlas states-albers-10m was drawn with
  const proj = d3.geoAlbersUsa().scale(1300).translate([487.5, 305]);
  let cur = FULL.slice(), sel = null, raf = 0, EVS = [], tipI = null, pinned = false;
  const tip = document.getElementById('tip');
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const day = iso => new Date(iso + 'T12:00:00');

  function range(e) {
    const s = day(e.start), t = day(e.end);
    const end = s.getMonth() === t.getMonth() ? t.getDate() : MON[t.getMonth()] + ' ' + t.getDate();
    return `${MON[s.getMonth()]} ${s.getDate()}–${end}, ${t.getFullYear()}`;
  }

  // keep dots the same on-screen size while the viewBox zooms
  function sizeDots() {
    const k = cur[2] / (svg.clientWidth || 975); // map units per screen pixel
    dotsG.querySelectorAll('.dot').forEach(d => { d.setAttribute('r', 7 * k); d.style.strokeWidth = 1.8 * k; });
    placeTip();
    syncZoomUI();
    svg.classList.toggle('zoomed', cur[2] < 700);
    // state labels and city marks keep a steady on-screen size too
    labelsG.querySelectorAll('.lbl').forEach(t => t.style.fontSize = (10.5 * k) + 'px');
    citiesG.querySelectorAll('.city').forEach(c => {
      const r = c.querySelector('rect'), t = c.querySelector('text');
      const x = +c.dataset.x, y = +c.dataset.y;
      r.setAttribute('x', x - 1.6 * k); r.setAttribute('y', y - 1.6 * k); r.setAttribute('width', 3.2 * k); r.setAttribute('height', 3.2 * k);
      t.setAttribute('x', x + 4 * k); t.setAttribute('y', y + 1.3 * k); t.style.fontSize = (10 * k) + 'px'; t.style.strokeWidth = (3 * k) + 'px';
    });
  }
  addEventListener('resize', sizeDots);
  addEventListener('hashchange', () => {
    const h = location.hash.slice(1).toUpperCase();
    if (h !== (sel || '') && (!h || document.getElementById('st-' + h))) pick(h || null);
  });
  // ── manual zoom: ruler slider, +/− and drag-to-pan ──
  const MAXZ = 14, MI_PER_UNIT = 6371 / 1300 / 1.609; // albersUsa scale 1300 → ~3 miles per map unit
  const zoomEl = document.getElementById('zoom'), barEl = document.getElementById('scale-bar'), lblEl = document.getElementById('scale-lbl');
  function clampBox(b) {
    const [x, y, w, h] = b;
    return [Math.max(0, Math.min(975 - w, x)), Math.max(0, Math.min(610 - h, y)), w, h];
  }
  function setZoom(z, cx, cy) {
    cancelAnimationFrame(raf);
    z = Math.max(1, Math.min(MAXZ, z));
    if (cx == null) { cx = cur[0] + cur[2] / 2; cy = cur[1] + cur[3] / 2; }
    const w = 975 / z, h = 610 / z;
    cur = clampBox([cx - w / 2, cy - h / 2, w, h]);
    svg.setAttribute('viewBox', cur.join(' '));
    sizeDots();
  }
  function syncZoomUI() {
    const z = 975 / cur[2];
    if (document.activeElement !== zoomEl) zoomEl.value = (Math.log(z) / Math.log(MAXZ) * 100).toFixed(1);
    const miPerPx = MI_PER_UNIT * cur[2] / (svg.clientWidth || 975);
    const want = 80 * miPerPx;
    const nice = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].filter(n => n <= want).pop() || 5;
    barEl.style.width = (nice / miPerPx).toFixed(0) + 'px';
    lblEl.textContent = nice + ' mi';
    svg.classList.toggle('grab', cur[2] < 974);
  }
  zoomEl.addEventListener('input', () => setZoom(Math.pow(MAXZ, zoomEl.value / 100)));
  document.getElementById('zoom-in').addEventListener('click', () => setZoom(975 / cur[2] * 1.6));
  document.getElementById('zoom-out').addEventListener('click', () => setZoom(975 / cur[2] / 1.6));

  // drag the zoomed map around; a real drag swallows the click so it doesn't pick a state
  let drag = null, dragged = false;
  svg.addEventListener('pointerdown', e => {
    if (cur[2] >= 974 || e.button > 0) return;
    drag = { x: e.clientX, y: e.clientY, box: cur.slice(), id: e.pointerId }; dragged = false;
  });
  svg.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!dragged && Math.hypot(dx, dy) < 5) return;
    if (!dragged) { dragged = true; svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); cancelAnimationFrame(raf); }
    const k = drag.box[2] / svg.clientWidth;
    cur = clampBox([drag.box[0] - dx * k, drag.box[1] - dy * k, drag.box[2], drag.box[3]]);
    svg.setAttribute('viewBox', cur.join(' '));
    placeTip();
  });
  const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);

  function zoomTo(to) {
    cancelAnimationFrame(raf);
    const from = cur.slice(), t0 = performance.now(), dur = reduce ? 0 : 700;
    const step = now => {
      let k = dur ? Math.min(1, (now - t0) / dur) : 1;
      k = 1 - Math.pow(1 - k, 3);
      cur = from.map((v, i) => v + (to[i] - v) * k);
      svg.setAttribute('viewBox', cur.join(' '));
      sizeDots();
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function boxFor(st) {
    const b = document.getElementById('st-' + st).getBBox();
    const pad = Math.max(b.width, b.height) * .3 + 12;
    let w = b.width + pad * 2, h = b.height + pad * 2;
    if (w / h > 975 / 610) h = w * 610 / 975; else w = h * 975 / 610;
    return [b.x + b.width / 2 - w / 2, b.y + b.height / 2 - h / 2, w, h];
  }

  function pick(st) {
    if (st === sel) st = null;
    sel = st;
    document.querySelectorAll('.st').forEach(p => p.classList.toggle('on', p.id === 'st-' + st));
    chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', (c.dataset.st || null) === st));
    reset.classList.toggle('show', !!st);
    svg.classList.toggle('zoomed', !!st);
    zoomTo(st && document.getElementById('st-' + st) ? boxFor(st) : FULL);
    let shown = 0;
    list.querySelectorAll('.ev').forEach(r => { r.hidden = !!st && r.dataset.st !== st; if (!r.hidden) shown++; });
    const none = list.querySelector('.none');
    if (none) none.hidden = shown > 0;
    history.replaceState(null, '', st ? '#' + st : location.pathname);
    if (tipI != null && (!st || EVS[tipI].state !== st)) hideTip(true);
  }

  document.querySelectorAll('.st').forEach(p => p.addEventListener('click', () => pick(p.id.slice(3))));
  reset.addEventListener('click', () => pick(null));

  fetch('/milsim.json')
    .then(r => r.json())
    .then(data => {
      const today = new Date().toISOString().slice(0, 10);
      const evs = (data.events || []).filter(e => e.end >= today).sort((a, b) => a.start.localeCompare(b.start));
      EVS = evs;

      // dots
      evs.forEach((e, i) => {
        const xy = e.lng != null ? proj([e.lng, e.lat]) : null;
        if (!xy) return;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('class', 'dot'); c.setAttribute('cx', xy[0].toFixed(1)); c.setAttribute('cy', xy[1].toFixed(1));
        c.setAttribute('fill', `var(--${e.org})`); c.dataset.i = i;
        c.setAttribute('tabindex', '0');
        c.setAttribute('aria-label', `${e.name}, ${range(e)}, ${e.city}, ${e.state}`);
        c.addEventListener('mouseenter', () => { if (!pinned) showTip(i); });
        c.addEventListener('mouseleave', () => { if (!pinned) hideTip(); });
        c.addEventListener('focus', () => showTip(i));
        c.addEventListener('click', ev => {
          ev.stopPropagation();
          if (sel !== e.state) pick(e.state);
          showTip(i, true); flash(i);
        });
        dotsG.appendChild(c);
        const p = document.getElementById('st-' + e.state); if (p) p.classList.add('has');
      });
      sizeDots();

      // list
      list.innerHTML = evs.map((e, i) => {
        const s = day(e.start);
        return `<a class="ev" id="ev-${i}" data-st="${e.state}" data-i="${i}" href="${esc(e.url)}" target="_blank" rel="noopener">
          <div class="d"><b>${MON[s.getMonth()]}</b><i>${s.getDate()}</i><small>${s.getFullYear()}</small></div>
          <div class="im"${e.image ? ` style="background-image:url('${esc(e.image)}')"` : ''}></div>
          <div class="tx"><div class="org"><span style="background:var(--${e.org})"></span>${ORG[e.org] || e.org}</div>
            <div class="nm">${esc(e.name)}</div>
            <div class="dt">${range(e)} · ${esc(e.city)}, ${e.state}${e.venue ? ' · ' + esc(e.venue) : ''}</div></div>
          <div class="ar">Tickets →</div></a>`;
      }).join('') + '<div class="empty none" hidden>// No ops in this state right now.</div>';
      if (!evs.length) list.innerHTML = '<div class="empty">// No upcoming ops listed right now.</div>';

      // hovering a row lights its dot and vice versa
      list.querySelectorAll('.ev').forEach(r => {
        const dot = dotsG.querySelector(`.dot[data-i="${r.dataset.i}"]`);
        r.addEventListener('mouseenter', () => dot && dot.classList.add('hot'));
        r.addEventListener('mouseleave', () => dot && dot.classList.remove('hot'));
      });

      // state chips (also the easy way to pick small states on a phone)
      const counts = {};
      evs.forEach(e => counts[e.state] = (counts[e.state] || 0) + 1);
      chips.innerHTML = `<button class="chip active" type="button">All<span>${evs.length}</span></button>` +
        Object.keys(counts).sort().map(st => `<button class="chip" type="button" data-st="${st}">${st}<span>${counts[st]}</span></button>`).join('');
      chips.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => pick(c.dataset.st || null)));

      if (data.lastUpdated) document.getElementById('foot').textContent =
        '// Updated ' + new Date(data.lastUpdated).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
        ' from the organizers\' sites. Dates and locations can change — check the ticket page.';

      const h = location.hash.slice(1).toUpperCase();
      if (/^[A-Z]{2}$/.test(h) && document.getElementById('st-' + h)) pick(h);
    })
    .catch(() => { list.innerHTML = '<div class="empty">// Could not load ops. Try refreshing.</div>'; });

  function showTip(i, pin) {
    const e = EVS[i];
    tipI = i; pinned = !!pin;
    tip.innerHTML = (e.image ? `<div class="ti" style="background-image:url('${esc(e.image)}')"></div>` : '') +
      `<div class="tb"><div class="org"><span style="background:var(--${e.org})"></span>${ORG[e.org] || e.org}</div>
       <div class="nm">${esc(e.name)}</div><div class="dt">${range(e)}<br>${esc(e.city)}, ${e.state}</div>
       <a class="go" href="${esc(e.url)}" target="_blank" rel="noopener">Tickets →</a></div>`;
    tip.classList.toggle('pinned', pinned);
    tip.classList.add('show');
    placeTip();
  }
  function hideTip(force) {
    if (pinned && !force) return;
    tip.classList.remove('show', 'pinned'); tipI = null; pinned = false;
  }
  function placeTip() {
    if (tipI == null) return;
    const dot = dotsG.querySelector(`.dot[data-i="${tipI}"]`);
    if (!dot) return;
    const box = tip.parentElement.getBoundingClientRect(), d = dot.getBoundingClientRect();
    const cx = d.left + d.width / 2 - box.left, cy = d.top + d.height / 2 - box.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.max(6, Math.min(box.width - w - 6, cx - w / 2));
    const below = cy - h - 16 < 0;
    tip.classList.toggle('below', below);
    tip.style.left = left + 'px';
    tip.style.top = (below ? cy + 16 : cy - h - 16) + 'px';
    tip.style.setProperty('--ax', (cx - left) + 'px');
  }
  // click/tap anywhere else closes a pinned card
  document.addEventListener('click', ev => { if (pinned && !ev.target.closest('.tip, .dot')) hideTip(true); });
  addEventListener('keydown', ev => { if (ev.key === 'Escape') hideTip(true); });

  function flash(i) {
    const r = document.getElementById('ev-' + i);
    if (!r) return;
    r.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    r.classList.add('hot'); setTimeout(() => r.classList.remove('hot'), 1600);
  }
})();
</script>
</body>
</html>
