name: Weekly Change Detector

on:
  schedule:
    - cron: "0 10 * * 3"  # Every Wednesday at 10:00 AM UTC
  workflow_dispatch:         # Allow manual run from GitHub UI

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run change detector
        run: node scripts/fetch-changes.mjs

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changes-report.json field-hashes.json
          git diff --staged --quiet || git commit -m "chore: weekly field change report $(date +%Y-%m-%d)"
          git push
