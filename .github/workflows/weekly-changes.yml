name: Weekly Change Detector

on:
  schedule:
    - cron: "0 10 * * 3"  # Every Wednesday at 10:00 AM UTC
  workflow_dispatch:         # Allow manual run from GitHub UI

permissions:
  contents: write            # needed to commit and push the report

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fields with "render": true are loaded in headless Chromium (JS-built pages)
      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run change detector
        run: node scripts/fetch-changes.mjs

      # MilSim tab: American Milsim, MilSim West, RealSim → public/milsim.json (goes live on push)
      - name: Fetch national MilSim events
        run: node scripts/fetch-milsim.mjs || echo "milsim fetch failed — keeping previous data"

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changes-report.json field-hashes.json public/milsim.json
          git diff --staged --quiet || git commit -m "chore: weekly field change report $(date +%Y-%m-%d)"
          git push
